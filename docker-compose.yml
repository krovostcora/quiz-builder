services:
  backend:
    build: ./backend
    environment:
      PORT: 4000
      CLIENT_URL: http://localhost:3000
      DB_STORAGE: /data/database.sqlite
    ports:
      - '4000:4000'
    volumes:
      - quiz-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    environment:
      # Server-side requests go through the compose network
      API_URL: http://backend:4000
    ports:
      - '3000:3000'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  quiz-data: